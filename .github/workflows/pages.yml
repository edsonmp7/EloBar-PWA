name: Elo Bar - Android PWA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elobar-android-pwa
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Android PWA shell
        run: node scripts/validate.mjs

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage only public PWA assets
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/icons
          cp index.html app.js styles.css sw.js manifest.webmanifest logo-splash.png _site/
          cp icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png _site/icons/
          touch _site/.nojekyll
      - name: Upload PWA artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Android PWA
        id: deployment
        uses: actions/deploy-pages@v4
